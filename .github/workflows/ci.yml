name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 🔒 LOCKSTEP: `src/toolchain-lockstep.test.ts` requires this to equal
          # the `pnpmMajor` pinned in flake.nix, so a local shell and CI cannot
          # run different pnpm majors. Change both, or neither.
          version: 11

      - uses: actions/setup-node@v4
        with:
          # `.nvmrc` is the single authority for the node major — flake.nix
          # reads the same file. Never restate the version here.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
