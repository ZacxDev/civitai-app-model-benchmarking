# Supply-chain policy exception, version-pinned and TEMPORARY.
#
# pnpm 11 verifies the lockfile against its supply-chain policies even under
# `--frozen-lockfile`, where it skips resolution. It refuses any entry published
# within `minimumReleaseAge` (1 day by default), so CI rejected this branch with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION for the two entries below, published
# 2026-09-17T16:13:28Z. Nothing is wrong with the lockfile; it is younger than
# the policy allows.
#
# Both are FIRST-PARTY packages, published from civitai/civitai-app-starters by
# npm OIDC trusted publishing with no human step — not third-party code chosen
# off a public registry feed. They are pinned by EXACT version, so this file
# cannot silently widen: any later release of either package is still subject
# to the policy.
#
# 🔴 DELETE THIS FILE once the versions are past the cutoff (after
# 2026-09-18T16:13Z). Removing it cannot change resolution — the lockfile
# already pins both versions — so the deletion is a no-op for the build and is
# purely the removal of an exception that has served its purpose.
minimumReleaseAgeExclude:
  - '@civitai/app-sdk@0.42.0'
  - '@civitai/blocks-react@0.51.0'
