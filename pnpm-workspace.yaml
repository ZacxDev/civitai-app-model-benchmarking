# 🔴 THIS FILE EXISTS ONLY TO GET PAST pnpm's FRESHNESS GATE, and it IS part of the
# submitted bundle — the packager takes whatever is on disk bar `.env*` and `.git`.
#
# WHY IT APPEARED. `pnpm` refuses a dependency younger than its `minimumReleaseAge`
# (24 h by default here — `pnpm config get minimumReleaseAge` returning `undefined`
# means THE DEFAULT APPLIES, not that the gate is off). The versions below were
# published inside that window when the document-store port (0.5.0) bumped to the
# scaffold-verified `@civitai/*` set, so `pnpm install --frozen-lockfile` rejected
# them until they were named here. `CLAUDE.md`'s release protocol prescribes this
# shape; `civitai-app-gen-matrix` is the prior art.
#
# THE BUMP (0.5.0), and the pairing it follows: a fresh `civitai app create
# --template page-money` probe on CLI 0.1.126 (2026-10-16) scaffolds
# `@civitai/app-sdk ^0.71.0` + `@civitai/blocks-react ^0.73.0`, and the
# `page-elements` probe adds `@civitai/sdk ^0.14.0`. Those three ranges are copied
# verbatim. The bump is not optional: `app-sdk@0.55.0`'s canonical manifest schema
# does not know the `apps:storage` / `apps:storage:publish` scopes or the `storage`
# block, so `src/manifest.test.ts` cannot validate a document-store manifest on it.
#
# Registry publish instants (`npm view <pkg> time`), and when each entry goes inert:
#   @civitai/app-sdk@0.71.0   2026-10-15T03:08:57Z → exclude inert after ~2026-10-16T03:09Z
#   @civitai/sdk@0.14.0       2026-10-15T06:02:36Z → exclude inert after ~2026-10-16T06:03Z
# MEASURED 2026-10-16T02:52Z, cold `pnpm install --frozen-lockfile` (pnpm 11.25.0) on a
# copy holding only package.json + lockfile + this file: both entries → rc 0;
# app-sdk entry removed → rc 1 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION naming exactly
# `@civitai/app-sdk@0.71.0`; sdk entry removed → rc 1, naming exactly `@civitai/sdk@0.14.0`.
# RE-MEASURED 2026-10-16T03:31Z (same cold copy, same command): WITHOUT the app-sdk
# entry → rc 0, i.e. it had aged out at ~03:09Z, so it was REMOVED; without the sdk
# entry as well → rc 1, naming exactly `@civitai/sdk@0.14.0`, so that one stays.
# 🔴 REMOVE THE REMAINING ENTRY AFTER 2026-10-16T06:03Z — it then does nothing, and
# leaving it is how a list like this grows past what any `package.json` line resolves to.
# Already aged out at the bump, so deliberately ABSENT: `blocks-react@0.73.1` and
# `components@0.10.0` (both 2026-10-15T00:58Z), `theme@0.5.2` (2026-10-03).
#
# 🔴 THE EXCLUSIONS NAME EXACT VERSIONS ON PURPOSE. A bare package name would waive
# the gate for every future release of that package, silently, forever.
# 🔴 THIS LIST IS REPLACED, NOT APPENDED TO — the 0.5.0 bump removed the 0.63.0-era
# entries (`app-sdk@0.55.0`, `blocks-react@0.63.0`, `sdk@0.10.0`, `components@0.9.1`,
# `theme@0.5.0`) rather than keeping them alongside; none is resolvable from
# `package.json` any more. Sibling app repos append; THIS repo replaces.
# An interactive `pnpm install` does NOT fail — `minimumReleaseAgeStrict` defaults to
# false, so pnpm silently APPENDS the entries it needs (it wrote `0.55.0 || 0.71.0`
# during this bump). Only `--frozen-lockfile` turns the gate into a hard failure, so
# "it installed locally" is never evidence that this list is complete.
#
# ⚠️ `packages` IS NOT OPTIONAL even though this repo is a single package: the key is
# what makes this a workspace root rather than a stray config. Never delete this file
# because the exclusions went inert.
packages:
  - '.'

minimumReleaseAgeExclude:
  - '@civitai/sdk@0.14.0'
